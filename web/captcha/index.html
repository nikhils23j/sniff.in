<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src https://challenges.cloudflare.com; style-src 'unsafe-inline' https://challenges.cloudflare.com; img-src data: https://challenges.cloudflare.com" />
  <title>Verify you are human</title>
  <style>body{margin:0;padding:12px;font:14px system-ui,sans-serif;color:#302747;background:#fff}#status{margin-top:8px;color:#6b6478}</style>
</head>
<body>
  <div id="widget" class="cf-turnstile" data-callback="verified" data-expired-callback="expired" data-error-callback="failed"></div>
  <div id="status" role="status">Checking your browser…</div>
  <script>
    const sitekey = new URLSearchParams(location.search).get('sitekey') || '';
    const status = document.getElementById('status');
    const send = (type, token) => {
      const message = JSON.stringify({ type, token });
      window.ReactNativeWebView?.postMessage(message);
      if (window.parent !== window) window.parent.postMessage(message, '*');
    };
    window.verified = (token) => { status.textContent = 'Verified'; send('token', token); };
    window.expired = () => { status.textContent = 'Verification expired. Try again.'; send('expired'); };
    window.failed = () => { status.textContent = 'Verification failed. Try again.'; send('error'); };
    if (/^[A-Za-z0-9_-]{10,100}$/.test(sitekey)) {
      document.getElementById('widget').setAttribute('data-sitekey', sitekey);
      const script = document.createElement('script');
      script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    } else { status.textContent = 'Verification is not configured.'; send('error'); }
  </script>
</body>
</html>
